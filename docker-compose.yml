services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/exam-paper-generator
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
